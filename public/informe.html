function fmtInt(n) {
  return Math.round(n).toLocaleString('es-AR');
}

// Igual que en el nodo de n8n que procesa Zonaprop: las fechas que vienen del
// Sheet pueden llegar en distintos formatos segun como este formateada la celda
// (texto ISO, texto DD/MM/YYYY, numero de serie de Excel, o ya como Date). Esta
// funcion las normaliza todas a un objeto Date valido.
function parseFechaFlexible(valor) {
  if (valor === null || valor === undefined || valor === '') return null;
  if (valor instanceof Date) return isNaN(valor) ? null : valor;

  if (typeof valor === 'number') {
    const epoch = new Date(Date.UTC(1899, 11, 30));
    const d = new Date(epoch.getTime() + valor * 86400000);
    return isNaN(d) ? null : d;
  }

  const str = String(valor).trim();

  // ISO: 2026-06-01 (con o sin hora pegada atras)
  if (/^\d{4}-\d{2}-\d{2}/.test(str)) {
    const d = new Date(str.slice(0, 10) + 'T00:00:00');
    return isNaN(d) ? null : d;
  }

  // DD/MM/YYYY (formato que deja Sheets cuando la celda es tipo "Fecha")
  const partes = str.split('/');
  if (partes.length === 3 && partes[2].length === 4) {
    const [d, m, y] = partes;
    const fecha = new Date(`${y}-${m.padStart(2, '0')}-${d.padStart(2, '0')}T00:00:00`);
    return isNaN(fecha) ? null : fecha;
  }

  const fallback = new Date(str);
  return isNaN(fallback) ? null : fallback;
}

function fmtDate(valor) {
  const d = parseFechaFlexible(valor);
  if (!d) return valor || '';
  return d.toLocaleDateString('es-AR', { day: 'numeric', month: 'short' });
}

function daysBetween(a, b) {
  return Math.round((b - a) / 86400000);
}

function pctSafe(num, den) {
  return den > 0 ? (num / den) * 100 : 0;

  // jueves). La "clave" de cada semana es la fecha del corte que la cierra.
  const DIAS_SEMANA = { domingo: 0, lunes: 1, martes: 2, miercoles: 3, 'miércoles': 3, jueves: 4, viernes: 5, sabado: 6, 'sábado': 6 };
  const corteDiaNum = DIAS_SEMANA[(cfg.corte_semanal_dia || 'Jueves').toLowerCase()] ?? 4;
  function weekKey(dateStr) {
    if (!dateStr) return null;
    const str = String(dateStr);
    // Si ya trae hora (ej. fecha_creacion de Notion: "...T22:12:00.000Z"), no le
    // agregamos otra -- solo las fechas "puras" (YYYY-MM-DD) necesitan la hora
    // agregada para parsear en horario local en vez de UTC.
    const d = str.includes('T') ? new Date(str) : new Date(str + 'T00:00:00');
    if (isNaN(d)) return null;
    const diff = (corteDiaNum - d.getDay() + 7) % 7;
    const weekEnd = new Date(d);
    weekEnd.setDate(d.getDate() + diff);
    return weekEnd.toISOString().slice(0, 10);
  }

  // Se excluyen filas sin valor (ej. la marca "Publicacion inicial", que ya
  // se muestra por separado como el primer punto de la linea de tiempo).
  const propAjustes = ajustes.filter(r => r.propiedad_id === propiedadId && r.fecha && r.valor)
    .sort((a, b) => (parseFechaFlexible(a.fecha) || 0) - (parseFechaFlexible(b.fecha) || 0));

  const propMetricas = metricas.filter(r => r.propiedad_id === propiedadId && r.fecha)
    .sort((a, b) => new Date(a.fecha) - new Date(b.fecha));

  // Dedupe por notion_page_url (identificador unico del lead): si aparece mas de
  // una vez -- por ejemplo por corridas repetidas del sync -- nos quedamos con la
  // version mas reciente segun actualizado_at.
  function dedupeConsultas(rows) {
    const byUrl = new Map();
    rows.forEach(r => {
      const key = r.notion_page_id || `${r.nombre}|${r.fecha_creacion}`;
      const existing = byUrl.get(key);
      if (!existing || new Date(r.actualizado_at || 0) >= new Date(existing.actualizado_at || 0)) {
        byUrl.set(key, r);
      }
    });
    return [...byUrl.values()];
  }

  const propConsultas = dedupeConsultas(consultas.filter(r => r.propiedad_id === propiedadId))
    .sort((a, b) => new Date(b.fecha_creacion || 0) - new Date(a.fecha_creacion || 0));

  const HACE_7_DIAS = new Date(hoy);
  HACE_7_DIAS.setDate(hoy.getDate() - 7);

  const DESCARTE_ETAPAS = ['descarto', 'no califica', 'sin rta'];
  const grupos = { nuevas: [], coordinando: [], visitas: [], visitaron: [], descartaron: [] };
  propConsultas.forEach(c => {
    const etapa = (c.etapa || '').toLowerCase();
    if (DESCARTE_ETAPAS.includes(etapa)) { grupos.descartaron.push(c); return; }
    if (etapa === 'muestra') { grupos.visitas.push(c); return; }
    if (String(c.visito).toUpperCase() === 'TRUE') { grupos.visitaron.push(c); return; }
    const fecha = new Date(c.fecha_creacion || 0);
    if (fecha >= HACE_7_DIAS) grupos.nuevas.push(c);
    else grupos.coordinando.push(c);
  });

  const fechaPub = parseFechaFlexible(prop.fecha_publicacion);
  const diasPublicado = fechaPub ? daysBetween(fechaPub, hoy) : null;

  const expoTotal = propMetricas.reduce((s, r) => s + Number(r.exposicion || 0), 0);
  const clicksTotal = propMetricas.reduce((s, r) => s + Number(r.clicks || 0), 0);
  const promedioClicksDia = propMetricas.length ? clicksTotal / propMetricas.length : 0;
  const visitasCount = propConsultas.filter(r => String(r.visito).toUpperCase() === 'TRUE').length;

  // Promedio reciente: desde el ultimo ajuste de precio, o ultimos 30 dias si no
  // hubo ajustes. Si difiere bastante del promedio de toda la vida del aviso, usamos
  // el reciente para el semaforo y el titular -- es mas representativo de "como
  // viene ahora", en vez de diluirse con datos de antes de un cambio de precio.
  const fechaReferenciaReciente = propAjustes.length > 0
    ? parseFechaFlexible(propAjustes[propAjustes.length - 1].fecha)
    : new Date(hoy.getTime() - 30 * 86400000);

  const metricasRecientes = fechaReferenciaReciente
    ? propMetricas.filter(m => { const f = parseFechaFlexible(m.fecha); return f && f >= fechaReferenciaReciente; })
    : propMetricas;

  const promedioClicksDiaReciente = metricasRecientes.length
    ? metricasRecientes.reduce((s, r) => s + Number(r.clicks || 0), 0) / metricasRecientes.length
    : promedioClicksDia;

  const difiereMucho = promedioClicksDia > 0 &&
    Math.abs(promedioClicksDiaReciente - promedioClicksDia) / promedioClicksDia > 0.20 &&
    metricasRecientes.length >= 3; // evita "diferencias" con muy pocos dias de muestra

  const promedioMostrado = difiereMucho ? promedioClicksDiaReciente : promedioClicksDia;
  const promedioEtiqueta = difiereMucho ? ' (desde el último ajuste)' : '';

  let semaforo = { key: 'especulacion', label: 'Especulación' };
  if (promedioMostrado >= bandaPrueba) semaforo = { key: 'validacion', label: 'Validación' };
  else if (promedioMostrado >= bandaEspeculacion) semaforo = { key: 'prueba', label: 'Prueba' };

  // ---- Series semanales para los graficos de barras ----
  function agruparPorSemana(rows, fechaField, valorFields) {
    const map = new Map();
    rows.forEach(r => {
      const key = weekKey(r[fechaField]);
      if (!key) return;
      if (!map.has(key)) map.set(key, { semana: key, count: 0, ...Object.fromEntries(valorFields.map(f => [f, 0])) });
      const bucket = map.get(key);
      bucket.count++;
      valorFields.forEach(f => { bucket[f] += Number(r[f] || 0); });
    });
    return [...map.values()].sort((a, b) => new Date(a.semana) - new Date(b.semana));
  }

  const semanasMetricas = agruparPorSemana(propMetricas, 'fecha', ['clicks', 'exposicion']);
  const semanasConsultas = agruparPorSemana(propConsultas, 'fecha_creacion', []);
  const semanasConversion = semanasMetricas.map(w => {
    const consultasSemana = propConsultas.filter(c => weekKey(c.fecha_creacion) === w.semana).length;
    return {
      semana: w.semana,
      ctr: pctSafe(w.clicks, w.exposicion),
      tasaConsulta: pctSafe(consultasSemana, w.clicks),
    };
  });

  // ---- Nota automatica: compara la ultima semana completa vs la anterior ----
  function calcularTendencia() {
    if (semanasMetricas.length < 2) return null;
    const ultima = semanasMetricas[semanasMetricas.length - 1];
    const anterior = semanasMetricas[semanasMetricas.length - 2];
    const cambioClicks = anterior.clicks > 0 ? ((ultima.clicks - anterior.clicks) / anterior.clicks) * 100 : null;
    const ctrUltima = ultima.exposicion > 0 ? (ultima.clicks / ultima.exposicion) * 100 : null;
    const ctrAnterior = anterior.exposicion > 0 ? (anterior.clicks / anterior.exposicion) * 100 : null;
    return { ultima, anterior, cambioClicks, ctrUltima, ctrAnterior };
  }
  const tendencia = calcularTendencia();

  // ---- Benchmark vs. promedio de mercado según antigüedad ----
  const mesActual = Math.max(1, Math.ceil(diasPublicado / 30));
  const bench = promedios.find(r => mesActual >= Number(r.mes_desde) && mesActual <= Number(r.mes_hasta));

  // ---- "Qué hay de nuevo": foto actual agrupada por momento del proceso ----
  // No tenemos historial de cambios de etapa, asi que esto es una foto de HOY,
  // no un "avanzo desde la semana pasada" literal.
  const ETAPAS_COORDINANDO = ['coordinar', 'muestra'];
  const coordinandoCount = propConsultas.filter(c => ETAPAS_COORDINANDO.includes((c.etapa || '').toLowerCase())).length;

  const visitaronRecientes = grupos.visitaron.filter(c => {
    const ref = parseFechaFlexible(c.ultimo_contacto) || parseFechaFlexible(c.fecha_creacion);
    return ref && (hoy - ref) <= 7 * 86400000;
  }).length;

  // Comparacion semana actual vs semana pasada, para las mismas dos metricas.
  const HACE_14_DIAS = new Date(hoy.getTime() - 14 * 86400000);
  const nuevasSemanaPasada = propConsultas.filter(c => {
    const f = parseFechaFlexible(c.fecha_creacion);
    return f && f >= HACE_14_DIAS && f < HACE_7_DIAS;
  }).length;
  const visitaronSemanaPasada = grupos.visitaron.filter(c => {
    const ref = parseFechaFlexible(c.ultimo_contacto) || parseFechaFlexible(c.fecha_creacion);
    return ref && ref >= HACE_14_DIAS && ref < HACE_7_DIAS;
  }).length;

  // ---- Consultas por portal (columna "fuente") ----
  const portalStats = {};
  propConsultas.forEach(c => {
    const fuentes = (c.fuente || '').split(',').map(f => f.trim()).filter(Boolean);
    (fuentes.length ? fuentes : ['Sin dato']).forEach(f => { portalStats[f] = (portalStats[f] || 0) + 1; });
  });
  const portalStatsArr = Object.entries(portalStats).sort((a, b) => b[1] - a[1]);

  // ---- Efecto de cada ajuste de precio: promedio de clics/dia antes y despues ----
  function calcularSegmentosPrecio() {
    if (!fechaPub) return [];
    const eventos = [{ fecha: fechaPub, valor: Number(prop.valor_inicial || 0) || null, esInicial: true }]
      .concat(propAjustes.map(a => ({ fecha: parseFechaFlexible(a.fecha), valor: Number(a.valor), esInicial: false })))
      .filter(e => e.fecha)
      .sort((a, b) => a.fecha - b.fecha);

    if (eventos.length === 0) return [];

    function statsEnRango(desde, hasta) {
      const rows = propMetricas.filter(m => {
        const f = parseFechaFlexible(m.fecha);
        return f && f >= desde && f < hasta;
      });
      const dias = rows.length;
      const clicksTotal = rows.reduce((s, r) => s + Number(r.clicks || 0), 0);
      const expoTotal = rows.reduce((s, r) => s + Number(r.exposicion || 0), 0);
      const consultas = propConsultas.filter(c => {
        const f = parseFechaFlexible(c.fecha_creacion);
        return f && f >= desde && f < hasta;
      }).length;
      return {
        dias,
        clicksProm: dias ? clicksTotal / dias : null,
        clicksTotal,
        expoProm: dias ? expoTotal / dias : null,
        consultas,
      };
    }

    return eventos.map((ev, i) => {
      const desde = ev.fecha;
      const hasta = i + 1 < eventos.length ? eventos[i + 1].fecha : new Date(hoy.getTime() + 86400000);
      return {
        label: ev.esInicial ? 'Inicial' : `Ajuste ${fmtDate(ev.fecha)}`,
        valor: ev.valor,
        desde, hasta,
        stats: statsEnRango(desde, hasta),
      };
    });
  }
  const segmentosPrecio = calcularSegmentosPrecio();

  // ---- Render ----
  const timelineItems = [
    { date: prop.fecha_publicacion, label: 'Publicación', value: prop.valor_inicial ? 'USD ' + fmtInt(prop.valor_inicial) : null },
    ...propAjustes.map(a => ({ date: a.fecha, label: 'Ajuste', value: 'USD ' + fmtInt(a.valor) })),
    { date: hoy.toISOString(), label: 'Hoy', now: true },
    { date: prop.fecha_fin_autorizacion, label: 'Fin autorización' },
  ].filter(i => i.date);

  const kpiBadgeClass = { especulacion: 'status-especulacion', prueba: 'status-prueba', validacion: 'status-validacion' };

  let html = `
    <header class="hero">
      <div class="brand">Informe comercial · Malek Inmobiliaria</div>
      <h1>${prop.direccion || propiedadId}</h1>
      <p class="subtitle">${diasPublicado !== null ? diasPublicado + ' días publicada' : 'Fecha de publicación no disponible'} ${prop.valor_actual ? '· USD ' + fmtInt(prop.valor_actual) : ''}</p>
      <span class="status-pill ${kpiBadgeClass[semaforo.key]}"><span class="dot"></span>${semaforo.label} · ${fmtInt(promedioMostrado)} clics/día prom.${promedioEtiqueta}</span>
    </header>

    <div class="zone-header first">
      <span class="zone-icon">📋</span>
      <h2 class="zone-title">Resumen de la semana</h2>
    </div>

    <section>
      <div class="eyebrow">Línea de tiempo</div>
      <div class="timeline">
        ${timelineItems.map(i => `
          <div class="tl-item ${i.now ? 'now' : ''}">
            <div class="tl-dot"></div>
            <div class="tl-date">${fmtDate(i.date)}</div>
            <div class="tl-label">${i.label}</div>
            ${i.value ? `<div class="tl-value">${i.value}</div>` : ''}
          </div>`).join('')}
      </div>
    </section>

    <section>
      <div class="eyebrow">Métricas clave</div>
      <div class="chart-card">
        <div class="funnel-context">
          <span><strong>${diasPublicado !== null ? diasPublicado : '—'}</strong> días publicado</span>
          <span><strong>${promedioMostrado.toFixed(0)}</strong> clics/día promedio${promedioEtiqueta}</span>
        </div>
        <div class="funnel">
          <div class="funnel-step funnel-1">
            <span class="funnel-value">${fmtInt(expoTotal)}</span>
            <span class="funnel-label">Exposición</span>
          </div>
          <div class="funnel-conn">↓ ${pctSafe(clicksTotal, expoTotal).toFixed(1)}% hace clic</div>
          <div class="funnel-step funnel-2">
            <span class="funnel-value">${fmtInt(clicksTotal)}</span>
            <span class="funnel-label">Clics</span>
          </div>
          <div class="funnel-conn">↓ ${pctSafe(propConsultas.length, clicksTotal).toFixed(1)}% consulta</div>
          <div class="funnel-step funnel-3">
            <span class="funnel-value">${propConsultas.length}</span>
            <span class="funnel-label">Consultas</span>
          </div>
          <div class="funnel-conn">↓ ${pctSafe(visitasCount, propConsultas.length).toFixed(1)}% visita</div>
          <div class="funnel-step funnel-4">
            <span class="funnel-value">${visitasCount}</span>
            <span class="funnel-label">Visitas</span>
          </div>
        </div>
      </div>
    </section>

    <section>
      <div class="eyebrow">Esta semana</div>
      <p class="section-caption">Comparado con la semana anterior</p>
      <div class="weekly-grid weekly-grid-3">
        ${tendencia ? `
        <div class="kpi">
          <div class="kpi-label">Clics</div>
          <div class="kpi-value-row"><div class="kpi-value">${fmtInt(tendencia.ultima.clicks)}</div>${deltaPct(tendencia.cambioClicks)}</div>
        </div>` : `<div class="kpi"><div class="kpi-label">Clics</div><div class="kpi-value">—</div></div>`}
        ${tendencia && tendencia.ctrUltima !== null ? `
        <div class="kpi">
          <div class="kpi-label">Tasa de interés</div>
          <div class="kpi-value-row"><div class="kpi-value">${tendencia.ctrUltima.toFixed(1)}%</div>${tendencia.ctrAnterior !== null ? deltaPct(((tendencia.ctrUltima - tendencia.ctrAnterior) / (tendencia.ctrAnterior || 1)) * 100) : ''}</div>
        </div>` : `<div class="kpi"><div class="kpi-label">Tasa de interés</div><div class="kpi-value">—</div></div>`}
        <div class="kpi">
          <div class="kpi-label">Nuevas consultas</div>
          <div class="kpi-value-row"><div class="kpi-value">${grupos.nuevas.length}</div>${deltaCount(grupos.nuevas.length, nuevasSemanaPasada)}</div>
        </div>
      </div>
    </section>

    <div class="zone-header">
      <span class="zone-icon">📈</span>
      <h2 class="zone-title">Cómo viene funcionando</h2>
    </div>

    ${segmentosPrecio.length > 1 ? `
    <section>
      <div class="eyebrow">Efecto de los ajustes de precio</div>
      <div class="chart-card">
        <div class="table-scroll">
          <table class="bench-table segmentos-table">
            <thead>
              <tr><th></th>${segmentosPrecio.map(s => `<th>${s.label}<br><span class="segmento-valor">USD ${fmtInt(s.valor)}</span></th>`).join('')}</tr>
              <tr><th></th>${segmentosPrecio.map(s => `<th class="segmento-rango">${fmtDate(s.desde)}–${s.hasta < hoy ? fmtDate(s.hasta) : 'hoy'}<br>(${s.stats.dias} días)</th>`).join('')}</tr>
            </thead>
            <tbody>
              ${filaSegmentos('Exposición/día', segmentosPrecio.map(s => s.stats.expoProm))}
              ${filaSegmentos('Clics/día', segmentosPrecio.map(s => s.stats.clicksProm))}
              ${filaSegmentos('Clics totales', segmentosPrecio.map(s => s.stats.clicksTotal))}
              ${filaSegmentos('Consultas', segmentosPrecio.map(s => s.stats.consultas))}
            </tbody>
          </table>
        </div>
      </div>
    </section>` : ''}

    <section>
      <div class="eyebrow">Gráficos</div>
      <div class="chart-card">
        <div class="tabs">
          <button class="tab-btn active" data-chart-tab="diario">Visualizaciones diarias</button>
          <button class="tab-btn" data-chart-tab="clics_sem">Clics por semana</button>
          <button class="tab-btn" data-chart-tab="consultas_sem">Consultas por semana</button>
          <button class="tab-btn" data-chart-tab="ctr_sem">Conversión</button>
        </div>

        <div class="tab-panel" data-chart-panel="diario">
          <div class="legend">
            <span><span class="sw" style="background:#c0483d;opacity:.35"></span>Especulación &lt;${bandaEspeculacion}</span>
            <span><span class="sw" style="background:#a9760f;opacity:.35"></span>Prueba ${bandaEspeculacion}-${bandaPrueba}</span>
            <span><span class="sw" style="background:#3d7a44;opacity:.35"></span>Validación &gt;${bandaPrueba}</span>
          </div>
          <div style="position:relative;height:190px;">
            <canvas id="chartViews" role="img" aria-label="Visualizaciones diarias con bandas de semáforo"></canvas>
          </div>
        </div>

        <div class="tab-panel" data-chart-panel="clics_sem" hidden>
          <p class="chart-note">Suma de clics al aviso por semana.</p>
          <div style="position:relative;height:190px;">
            <canvas id="chartClicksSemana" role="img" aria-label="Clics por semana"></canvas>
          </div>
        </div>

        <div class="tab-panel" data-chart-panel="consultas_sem" hidden>
          <p class="chart-note">Cantidad de consultas nuevas recibidas por semana (corte los ${cfg.corte_semanal_dia || 'jueves'}).</p>
          <div style="position:relative;height:190px;">
            <canvas id="chartConsultasSemana" role="img" aria-label="Consultas por semana"></canvas>
          </div>
        </div>

        <div class="tab-panel" data-chart-panel="ctr_sem" hidden>
          <p class="chart-note">Dos tasas por semana: cuánto del que ve el aviso hace clic (CTR), y cuánto del que hace clic termina consultando.</p>
          <div class="legend">
            <span><span class="sw" style="background:#2a78d6"></span>Tasa de clic (CTR)</span>
            <span><span class="sw" style="background:#a9760f"></span>Tasa de consulta</span>
          </div>
          <div style="position:relative;height:190px;">
            <canvas id="chartCtrSemana" role="img" aria-label="Tasa de clic y tasa de consulta semanal"></canvas>
          </div>
        </div>
      </div>
    </section>

    ${tendencia ? `
    <section>
      <div class="chart-card" style="padding:14px 16px;">
        <p class="insight-note">
          ${notaTendencia(tendencia)}
        </p>
      </div>
    </section>` : ''}

    <section>
      <div class="eyebrow">Consultas por portal</div>
      <div class="chart-card">
        ${portalStatsArr.length === 0 ? '<div class="state-msg" style="padding:10px 0;">Todavía no hay consultas registradas.</div>' : `
        <div style="display:flex;align-items:center;gap:18px;">
          <div style="position:relative;width:110px;height:110px;flex-shrink:0;">
            <canvas id="chartPortales" role="img" aria-label="Consultas por portal"></canvas>
          </div>
          <div class="portal-legend">
            ${portalStatsArr.map(([portal, count], i) => `
              <div class="portal-legend-item">
                <span class="portal-dot" style="background:${colorForPortal(portal, i)}"></span>
                <span class="portal-name">${portal}</span>
                <span class="portal-count">${count} (${(count / propConsultas.length * 100).toFixed(0)}%)</span>
              </div>`).join('')}
          </div>
        </div>`}
      </div>
    </section>

    <div class="zone-header">
      <span class="zone-icon">🔍</span>
      <h2 class="zone-title">Contexto y comparación</h2>
    </div>

    ${bench ? `
    <section>
      <div class="eyebrow">Comparado con el promedio de mercado</div>
      <div class="chart-card">
        <table class="bench-table">
          <thead><tr><th></th><th>Esta propiedad</th><th>Promedio (mes ${mesActual})</th><th>vs. promedio</th></tr></thead>
          <tbody>
            ${benchRow('Exposición', expoTotal, bench.exposicion_promedio)}
            ${benchRow('Consultas', propConsultas.length, bench.consultas_promedio)}
            ${benchRow('Visitas', visitasCount, bench.visitas_presenciales_promedio)}
          </tbody>
        </table>
        ${diasPublicado > Number(cfg.dias_recordatorio_ajuste || 60) ? `
        <div class="reminder">⚠️ A esta altura, cuanto más pasa el tiempo sin acercarse al promedio, más difícil se vuelve concretar la venta al valor actual — suele ser señal de revisar el precio.</div>` : ''}
      </div>
    </section>` : ''}

    <section>
      <div class="eyebrow">Panorama de consultas</div>
      <div class="chart-card">
        <div class="tabs">
          <button class="tab-btn active" data-tab="nuevas">Nuevas <span class="tab-count">${grupos.nuevas.length}</span></button>
          <button class="tab-btn" data-tab="coordinando">Coordinando <span class="tab-count">${grupos.coordinando.length}</span></button>
          <button class="tab-btn" data-tab="visitas">Visitas <span class="tab-count">${grupos.visitas.length}</span></button>
          <button class="tab-btn" data-tab="visitaron">Visitaron <span class="tab-count">${grupos.visitaron.length}</span></button>
          <button class="tab-btn" data-tab="descartaron">Descartaron <span class="tab-count">${grupos.descartaron.length}</span></button>
        </div>
        <div class="tab-panel" data-panel="nuevas">${renderGrupo(grupos.nuevas, 'No hay consultas nuevas en los últimos 7 días.')}</div>
        <div class="tab-panel" data-panel="coordinando" hidden>${renderGrupo(grupos.coordinando, 'No hay consultas más antiguas sin resolver.')}</div>
        <div class="tab-panel" data-panel="visitas" hidden>${renderGrupo(grupos.visitas, 'No hay muestras agendadas.')}</div>
        <div class="tab-panel" data-panel="visitaron" hidden>${renderGrupo(grupos.visitaron, 'Todavía nadie visitó el departamento.')}</div>
        <div class="tab-panel" data-panel="descartaron" hidden>${renderGrupo(grupos.descartaron, 'Nadie descartó la propiedad todavía.')}</div>
      </div>
    </section>
  `;

  app.innerHTML = html;

  document.querySelectorAll('.tab-btn[data-tab]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn[data-tab]').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel[data-panel]').forEach(p => p.hidden = true);
      btn.classList.add('active');
      document.querySelector(`.tab-panel[data-panel="${btn.dataset.tab}"]`).hidden = false;
    });
  });

  function benchRow(label, actual, prom) {
    const ratio = prom > 0 ? (actual / prom) * 100 : 0;
    const delta = ratio - 100;
    const cls = delta >= -10 ? 'r-high' : delta >= -40 ? 'r-mid' : 'r-low';
    const texto = `${delta >= 0 ? '+' : ''}${delta.toFixed(0)}%`;
    return `<tr><td>${label}</td><td>${fmtInt(actual)}</td><td>${fmtInt(prom)}</td><td class="bench-ratio ${cls}">${texto}</td></tr>`;
  }

  function deltaPct(pct) {
    if (pct === null || pct === undefined || isNaN(pct)) return `<span class="delta delta-flat">—</span>`;
    const abs = Math.abs(pct);
    if (abs <= 5) return `<span class="delta delta-flat">≈ igual</span>`;
    const arrow = pct > 0 ? '▲' : '▼';
    const cls = pct > 0 ? 'delta-up' : 'delta-down';
    return `<span class="delta ${cls}">${arrow} ${abs.toFixed(0)}%</span>`;
  }

  function deltaCount(actual, anterior) {
    const diff = actual - anterior;
    if (diff === 0) return `<span class="delta delta-flat">≈ igual</span>`;
    const arrow = diff > 0 ? '▲' : '▼';
    const cls = diff > 0 ? 'delta-up' : 'delta-down';
    return `<span class="delta ${cls}">${arrow} ${Math.abs(diff)}</span>`;
  }

  function segmentoCelda(valor, valorAnterior) {
    const texto = (valor === null || valor === undefined) ? '—' : fmtInt(valor);
    if (valorAnterior === null || valorAnterior === undefined) {
      return `<td>${texto}</td>`;
    }
    const cambio = (valorAnterior > 0 && valor !== null) ? ((valor - valorAnterior) / valorAnterior) * 100 : null;
    return `<td><div>${texto}</div>${cambio !== null ? deltaPct(cambio) : ''}</td>`;
  }

  function filaSegmentos(label, valores) {
    const celdas = valores.map((v, i) => segmentoCelda(v, i > 0 ? valores[i - 1] : null)).join('');
    return `<tr><td>${label}</td>${celdas}</tr>`;
  }

  function portalRow(portal, count, total) {
    const pct = total > 0 ? (count / total) * 100 : 0;
    return `
      <div style="margin-bottom:10px;">
        <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;">
          <span>${portal}</span><span style="color:var(--muted);">${count}</span>
        </div>
        <div style="height:6px;background:var(--paper);border-radius:99px;overflow:hidden;">
          <div style="height:100%;width:${pct}%;background:var(--accent);border-radius:99px;"></div>
        </div>
      </div>`;
  }

  function notaTendencia(t) {
    const partes = [];
    if (t.cambioClicks !== null) {
      const abs = Math.abs(t.cambioClicks);
      const dir = abs <= 5 ? 'se mantuvieron estables' : t.cambioClicks > 0 ? `subieron un ${abs.toFixed(0)}%` : `bajaron un ${abs.toFixed(0)}%`;
      partes.push(`Los clics semanales ${dir} respecto a la semana anterior (${t.anterior.clicks} → ${t.ultima.clicks}).`);
    }
    if (t.ctrUltima !== null && t.ctrAnterior !== null) {
      const diff = t.ctrUltima - t.ctrAnterior;
      if (Math.abs(diff) > 0.3) {
        partes.push(`La tasa de interés ${diff > 0 ? 'mejoró' : 'empeoró'}, de ${t.ctrAnterior.toFixed(1)}% a ${t.ctrUltima.toFixed(1)}% — sugiere que el aviso en sí ${diff > 0 ? 'se volvió más atractivo' : 'perdió algo de atractivo'} (fotos, precio, título), más allá de cuánta exposición da el portal.`);
      }
    }
    return partes.join(' ') || 'Todavía no hay suficientes semanas de datos para calcular una tendencia confiable.';
  }

  function renderGrupo(rows, emptyMsg) {
    if (rows.length === 0) return `<div class="state-msg" style="padding:20px 0;">${emptyMsg}</div>`;
    return rows.map(c => visitRow(c)).join('');
  }

  function nombreCorto(nombreCompleto) {
    const n = (nombreCompleto || '').trim();
    const idx = n.indexOf(' ');
    if (idx === -1) return n;
    const primero = n.slice(0, idx);
    const resto = n.slice(idx + 1).trim();
    return resto ? `${primero} ${resto[0]}.` : primero;
  }

  function etapaBadgeClass(etapa) {
    const e = (etapa || '').toLowerCase();
    if (['descarto', 'no califica', 'sin rta'].includes(e)) return 'status-especulacion';
    if (['compro', 'listo', 'reserva'].includes(e)) return 'status-validacion';
    return 'status-prueba';
  }

  function visitRow(c) {
    const etapa = (c.etapa || '').toLowerCase();
    let iconClass = 'ic-nuevo';
    if (['descarto', 'no califica', 'sin rta'].includes(etapa)) iconClass = 'ic-descarto';
    else if (['seguimiento', 'coordinar', 'negociando', 'frio'].includes(etapa)) iconClass = 'ic-seguimiento';
    else if (['compro', 'listo', 'reserva'].includes(etapa)) iconClass = 'ic-avance';
    return `
      <div class="visit">
        <div class="visit-icon ${iconClass}"></div>
        <div>
          <div class="visit-name">${nombreCorto(c.nombre) || 'Consulta'} ${c.etapa ? `<span class="etapa-badge ${etapaBadgeClass(c.etapa)}">${c.etapa}</span>` : ''}</div>
          <div class="visit-meta">${fmtDate(c.fecha_creacion)} · ${c.fuente || ''}</div>
          ${c.feedback_visita ? `<div class="visit-feedback">${c.feedback_visita}</div>` : ''}
        </div>
      </div>`;
  }

  // ---- Gráficos (carga diferida: recién se crea cada uno la primera vez que
  // se muestra su pestaña, para que Chart.js no calcule mal el tamaño de un
  // canvas que arranca oculto) ----
  const chartInstances = {};

  function crearChartDiario() {
    const labels = propMetricas.map(r => fmtDate(r.fecha));
    const values = propMetricas.map(r => Number(r.clicks || 0));
    const bandsPlugin = {
      id: 'bands',
      beforeDatasetsDraw(chart) {
        const { ctx, chartArea: { left, right }, scales: { y } } = chart;
        const top = Math.max(y.max, bandaPrueba + 10);
        const zones = [
          { from: bandaPrueba, to: top, color: 'rgba(61,122,68,0.14)' },
          { from: bandaEspeculacion, to: bandaPrueba, color: 'rgba(169,118,15,0.14)' },
          { from: 0, to: bandaEspeculacion, color: 'rgba(192,72,61,0.10)' },
        ];
        zones.forEach(z => {
          const yTop = y.getPixelForValue(Math.min(z.to, y.max));
          const yBottom = y.getPixelForValue(z.from);
          ctx.fillStyle = z.color;
          ctx.fillRect(left, yTop, right - left, yBottom - yTop);
        });
      }
    };
    return new Chart(document.getElementById('chartViews'), {
      type: 'line',
      data: { labels, datasets: [{ label: 'Clics', data: values, borderColor: '#2a78d6', borderWidth: 2, pointRadius: 0, pointHoverRadius: 5, pointHoverBackgroundColor: '#2a78d6', pointHoverBorderColor: '#fff', pointHoverBorderWidth: 2, pointHitRadius: 12, tension: 0.25 }] },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { display: false },
          tooltip: { backgroundColor: '#152238', titleColor: '#fff', bodyColor: '#fff', padding: 10, cornerRadius: 6, displayColors: false,
            callbacks: { label: (ctx) => `${ctx.parsed.y} clics` } }
        },
        scales: {
          x: { ticks: { maxTicksLimit: 6, color: '#8891a1', font: { size: 10 } }, grid: { display: false } },
          y: { ticks: { color: '#8891a1', font: { size: 10 } }, grid: { color: '#e6e4dd' } }
        }
      },
      plugins: [bandsPlugin]
    });
  }

  function crearChartBarras(canvasId, semanas, valorFn, etiqueta, sufijo) {
    return new Chart(document.getElementById(canvasId), {
      type: 'bar',
      data: {
        labels: semanas.map(w => fmtDate(w.semana)),
        datasets: [{ label: etiqueta, data: semanas.map(valorFn), backgroundColor: '#2a78d6', borderRadius: 4, maxBarThickness: 28 }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: { backgroundColor: '#152238', titleColor: '#fff', bodyColor: '#fff', padding: 10, cornerRadius: 6, displayColors: false,
            callbacks: { label: (ctx) => `${ctx.parsed.y}${sufijo || ''}` } }
        },
        scales: {
          x: { ticks: { color: '#8891a1', font: { size: 10 } }, grid: { display: false } },
          y: { ticks: { color: '#8891a1', font: { size: 10 } }, grid: { color: '#e6e4dd' }, beginAtZero: true }
        }
      }
    });
  }

  function crearChartConversion() {
    return new Chart(document.getElementById('chartCtrSemana'), {
      type: 'bar',
      data: {
        labels: semanasConversion.map(w => fmtDate(w.semana)),
        datasets: [
          { label: 'Tasa de clic (CTR)', data: semanasConversion.map(w => +w.ctr.toFixed(1)), backgroundColor: '#2a78d6', borderRadius: 4, maxBarThickness: 18 },
          { label: 'Tasa de consulta', data: semanasConversion.map(w => +w.tasaConsulta.toFixed(1)), backgroundColor: '#a9760f', borderRadius: 4, maxBarThickness: 18 },
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: '#152238', titleColor: '#fff', bodyColor: '#fff', padding: 10, cornerRadius: 6,
            callbacks: { label: (ctx) => `${ctx.dataset.label}: ${ctx.parsed.y}%` }
          }
        },
        scales: {
          x: { ticks: { color: '#8891a1', font: { size: 10 } }, grid: { display: false } },
          y: { ticks: { color: '#8891a1', font: { size: 10 } }, grid: { color: '#e6e4dd' }, beginAtZero: true }
        }
      }
    });
  }

  function ensureChart(tab) {
    if (chartInstances[tab]) { chartInstances[tab].resize(); return; }
    if (tab === 'diario') chartInstances[tab] = crearChartDiario();
    else if (tab === 'consultas_sem') chartInstances[tab] = crearChartBarras('chartConsultasSemana', semanasConsultas, w => w.count, 'Consultas', ' consultas');
    else if (tab === 'clics_sem') chartInstances[tab] = crearChartBarras('chartClicksSemana', semanasMetricas, w => w.clicks, 'Clics', ' clics');
    else if (tab === 'ctr_sem') chartInstances[tab] = crearChartConversion();
  }

  document.querySelectorAll('[data-chart-tab]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('[data-chart-tab]').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('[data-chart-panel]').forEach(p => p.hidden = true);
      btn.classList.add('active');
      document.querySelector(`[data-chart-panel="${btn.dataset.chartTab}"]`).hidden = false;
      ensureChart(btn.dataset.chartTab);
    });
  });
  ensureChart('diario');

  // ---- Gráfico de torta: consultas por portal (no está en una pestaña, se
  // crea directo ya que su canvas es visible desde el principio) ----
  if (portalStatsArr.length > 0) {
    new Chart(document.getElementById('chartPortales'), {
      type: 'doughnut',
      data: {
        labels: portalStatsArr.map(([p]) => p),
        datasets: [{ data: portalStatsArr.map(([, c]) => c), backgroundColor: portalStatsArr.map(([p], i) => colorForPortal(p, i)), borderWidth: 2, borderColor: '#fff' }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: '#152238', titleColor: '#fff', bodyColor: '#fff', padding: 10, cornerRadius: 6, displayColors: false,
            callbacks: { label: (ctx) => `${ctx.label}: ${ctx.parsed} (${(ctx.parsed / propConsultas.length * 100).toFixed(0)}%)` }
          }
        }
      }
    });
  }
}

render();
</script>
</body>
</html>
