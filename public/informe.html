<style>
  :root{
    --ink:#152238;
    --ink-soft:#4b5567;
    --muted:#8891a1;
    --paper:#f6f5f1;
    --card:#ffffff;
    --line:#e6e4dd;
    --accent:#2a78d6;
    --accent-deep:#184d8f;
    --red:#c0483d;
    --red-bg:#f6e6e3;
    --amber:#a9760f;
    --amber-bg:#f6ecd7;
    --green:#3d7a44;
    --green-bg:#e4efe2;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:640px;margin:0 auto;padding:0 18px 64px;}
  .top-rail{height:5px;background:linear-gradient(90deg,var(--red),var(--amber),var(--green));}
  header.hero{padding:28px 0 20px;border-bottom:1px solid var(--line);}
  .brand{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:14px;}
  h1{
    font-family:'Inter Tight',sans-serif;
    font-size:26px;font-weight:800;letter-spacing:-.01em;
    margin:0 0 6px;color:var(--ink);
  }
  .subtitle{font-size:14px;color:var(--ink-soft);margin:0 0 14px;}
  .status-pill{
    display:inline-flex;align-items:center;gap:6px;
    font-size:12px;font-weight:600;padding:5px 12px;border-radius:99px;
  }
  .status-pill .dot{width:7px;height:7px;border-radius:50%;}
  .status-especulacion{background:var(--red-bg);color:var(--red);}
  .status-especulacion .dot{background:var(--red);}
  .status-prueba{background:var(--amber-bg);color:var(--amber);}
  .status-prueba .dot{background:var(--amber);}
  .status-validacion{background:var(--green-bg);color:var(--green);}
  .status-validacion .dot{background:var(--green);}

  section{margin-top:34px;}
  .eyebrow{
    font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--muted);font-weight:700;margin-bottom:12px;
  }

  .timeline{display:flex;position:relative;padding-top:6px;}
  .timeline:before{content:'';position:absolute;top:11px;left:16px;right:16px;height:1px;background:var(--line);}
  .tl-item{flex:1;text-align:center;position:relative;z-index:1;}
  .tl-dot{width:9px;height:9px;border-radius:50%;background:var(--muted);margin:0 auto 8px;}
  .tl-item.now .tl-dot{background:var(--accent);width:11px;height:11px;box-shadow:0 0 0 4px rgba(42,120,214,.15);}
  .tl-date{font-size:11px;color:var(--muted);}
  .tl-label{font-size:11.5px;font-weight:600;margin-top:2px;line-height:1.3;}
  .tl-item.now .tl-label{color:var(--accent-deep);}

  .kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 12px;}
  .kpi-label{font-size:11px;color:var(--muted);margin-bottom:6px;font-weight:500;}
  .kpi-value{font-family:'Inter Tight',sans-serif;font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em;}
  .kpi-badge{display:inline-block;margin-top:6px;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:99px;}

  .chart-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 14px 10px;}
  .chart-title{font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:10px;}
  .legend{display:flex;gap:14px;font-size:11px;color:var(--muted);margin-bottom:8px;flex-wrap:wrap;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .sw{width:9px;height:9px;border-radius:2px;}

  .bench-table{width:100%;border-collapse:collapse;font-size:13px;}
  .bench-table th{text-align:left;font-size:11px;color:var(--muted);font-weight:600;padding-bottom:8px;border-bottom:1px solid var(--line);}
  .bench-table td{padding:9px 0;border-bottom:1px solid var(--line);}
  .bench-table tr:last-child td{border-bottom:none;}
  .bench-ratio{font-weight:700;}
  .r-low{color:var(--red);} .r-mid{color:var(--amber);} .r-high{color:var(--green);}
  .reminder{
    margin-top:12px;background:var(--amber-bg);border-radius:var(--radius);
    padding:12px 14px;font-size:13px;color:#5c4108;line-height:1.5;
  }

  .visit{display:flex;gap:11px;padding:12px 0;border-top:1px solid var(--line);}
  .visit:first-child{border-top:none;}
  .visit-icon{width:8px;height:8px;border-radius:50%;margin-top:6px;flex-shrink:0;}
  .ic-descarto{background:var(--red);} .ic-seguimiento{background:var(--amber);} .ic-avance{background:var(--green);} .ic-nuevo{background:var(--muted);}
  .visit-name{font-weight:600;font-size:14px;}
  .visit-meta{font-size:11.5px;color:var(--muted);margin-top:1px;}
  .visit-feedback{font-size:13px;color:var(--ink-soft);margin-top:5px;line-height:1.4;}

  footer{margin-top:40px;text-align:center;font-size:11.5px;color:var(--muted);}
  .state-msg{padding:60px 20px;text-align:center;color:var(--muted);font-size:14px;}
  .err{color:var(--red);}

  @media (max-width:420px){
    .kpi-grid{grid-template-columns:repeat(2,1fr);}
    h1{font-size:22px;}
  }
</style>
</head>
<body>
<div class="top-rail"></div>
<div class="wrap">
  <div id="app"><div class="state-msg">Cargando informe…</div></div>
  <footer id="footer">Malek Inmobiliaria</footer>
</div>

<script>
// ============================================================
// CONFIG — ajustar solo si cambia el ID del Sheet maestro
// ============================================================
const SHEET_ID = '12lQ6cSePJTBY0GqAbF8GMBZD68f7_WspzwJv2o2K0X8';

function fmtInt(n) {
  return Math.round(n).toLocaleString('es-AR');
}

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toLocaleDateString('es-AR', { day: 'numeric', month: 'short' });
}

function daysBetween(a, b) {
  return Math.round((b - a) / 86400000);
}

// ============================================================
// MAIN
// ============================================================
async function render() {
  const app = document.getElementById('app');
  const params = new URLSearchParams(location.search);
  const propiedadId = params.get('p');

  if (!propiedadId) {
    app.innerHTML = `<div class="state-msg">Falta el parámetro <code>?p=id_propiedad</code> en el link.</div>`;
    return;
  }

  const dataEl = document.getElementById('report-data');
  if (!dataEl) {
    app.innerHTML = `<div class="state-msg err">Falta el bloque de datos incrustado.</div>`;
    return;
  }
  const bundle = JSON.parse(dataEl.textContent);
  const { propiedades, ajustes_precio: ajustes, metricas_diarias: metricas, consultas, promedios_mercado: promedios, config, generado_at } = bundle;
  const footerEl = document.getElementById('footer');
  if (footerEl && generado_at) {
    const g = new Date(generado_at);
    footerEl.textContent = `Actualizado el ${g.toLocaleDateString('es-AR')} a las ${g.toLocaleTimeString('es-AR', {hour:'2-digit',minute:'2-digit'})} · Malek Inmobiliaria`;
  }

  const prop = propiedades.find(r => r.propiedad_id === propiedadId);
  if (!prop) {
    app.innerHTML = `<div class="state-msg">No se encontró la propiedad "${propiedadId}".</div>`;
    return;
  }

  const cfg = {};
  config.forEach(r => cfg[r.parametro] = r.valor);
  const bandaEspeculacion = Number(cfg.semaforo_especulacion_max || 25);
  const bandaPrueba = Number(cfg.semaforo_prueba_max || 50);

  // Se excluyen filas sin valor (ej. la marca "Publicacion inicial", que ya
  // se muestra por separado como el primer punto de la linea de tiempo).
  const propAjustes = ajustes.filter(r => r.propiedad_id === propiedadId && r.fecha && r.valor)
    .sort((a, b) => new Date(a.fecha) - new Date(b.fecha));

  const propMetricas = metricas.filter(r => r.propiedad_id === propiedadId && r.fecha)
    .sort((a, b) => new Date(a.fecha) - new Date(b.fecha));

  const propConsultas = consultas.filter(r => r.propiedad_id === propiedadId)
    .sort((a, b) => new Date(b.fecha_creacion || 0) - new Date(a.fecha_creacion || 0));

  const hoy = new Date();
  const fechaPub = new Date(prop.fecha_publicacion);
  const diasPublicado = daysBetween(fechaPub, hoy);

  const expoTotal = propMetricas.reduce((s, r) => s + Number(r.exposicion || 0), 0);
  const clicksTotal = propMetricas.reduce((s, r) => s + Number(r.clicks || 0), 0);
  const promedioClicksDia = propMetricas.length ? clicksTotal / propMetricas.length : 0;
  const visitasCount = propConsultas.filter(r => String(r.visito).toUpperCase() === 'TRUE').length;

  let semaforo = { key: 'especulacion', label: 'Especulación' };
  if (promedioClicksDia >= bandaPrueba) semaforo = { key: 'validacion', label: 'Validación' };
  else if (promedioClicksDia >= bandaEspeculacion) semaforo = { key: 'prueba', label: 'Prueba' };

  // ---- Benchmark vs. promedio de mercado según antigüedad ----
  const mesActual = Math.max(1, Math.ceil(diasPublicado / 30));
  const bench = promedios.find(r => mesActual >= Number(r.mes_desde) && mesActual <= Number(r.mes_hasta));

  // ---- Render ----
  const timelineItems = [
    { date: prop.fecha_publicacion, label: `Publicación${prop.valor_inicial ? ' · USD ' + fmtInt(prop.valor_inicial) : ''}` },
    ...propAjustes.map(a => ({ date: a.fecha, label: `Ajuste · USD ${fmtInt(a.valor)}` })),
    { date: hoy.toISOString(), label: 'Hoy', now: true },
    { date: prop.fecha_fin_autorizacion, label: 'Fin autorización' },
  ].filter(i => i.date);

  const kpiBadgeClass = { especulacion: 'status-especulacion', prueba: 'status-prueba', validacion: 'status-validacion' };

  let html = `
    <header class="hero">
      <div class="brand">Informe comercial · Malek Inmobiliaria</div>
      <h1>${prop.direccion || propiedadId}</h1>
      <p class="subtitle">${diasPublicado} días publicada ${prop.valor_actual ? '· USD ' + fmtInt(prop.valor_actual) : ''}</p>
      <span class="status-pill ${kpiBadgeClass[semaforo.key]}"><span class="dot"></span>${semaforo.label} · ${fmtInt(promedioClicksDia)} clics/día prom.</span>
    </header>

    <section>
      <div class="eyebrow">Línea de tiempo</div>
      <div class="timeline">
        ${timelineItems.map(i => `
          <div class="tl-item ${i.now ? 'now' : ''}">
            <div class="tl-dot"></div>
            <div class="tl-date">${fmtDate(i.date)}</div>
            <div class="tl-label">${i.label}</div>
          </div>`).join('')}
      </div>
    </section>

    <section>
      <div class="eyebrow">Métricas clave</div>
      <div class="kpi-grid">
        <div class="kpi"><div class="kpi-label">Exposición acum.</div><div class="kpi-value">${fmtInt(expoTotal)}</div></div>
        <div class="kpi"><div class="kpi-label">Clics acum.</div><div class="kpi-value">${fmtInt(clicksTotal)}</div></div>
        <div class="kpi"><div class="kpi-label">Consultas</div><div class="kpi-value">${propConsultas.length}</div></div>
        <div class="kpi"><div class="kpi-label">Visitas al dpto</div><div class="kpi-value">${visitasCount}</div></div>
        <div class="kpi"><div class="kpi-label">Días publicado</div><div class="kpi-value">${diasPublicado}</div></div>
        <div class="kpi"><div class="kpi-label">Promedio clics/día</div><div class="kpi-value">${promedioClicksDia.toFixed(0)}</div></div>
      </div>
    </section>

    <section>
      <div class="eyebrow">Visualizaciones diarias</div>
      <div class="chart-card">
        <div class="legend">
          <span><span class="sw" style="background:#c0483d;opacity:.35"></span>Especulación &lt;${bandaEspeculacion}</span>
          <span><span class="sw" style="background:#a9760f;opacity:.35"></span>Prueba ${bandaEspeculacion}-${bandaPrueba}</span>
          <span><span class="sw" style="background:#3d7a44;opacity:.35"></span>Validación &gt;${bandaPrueba}</span>
        </div>
        <div style="position:relative;height:190px;">
          <canvas id="chartViews" role="img" aria-label="Visualizaciones diarias con bandas de semáforo"></canvas>
        </div>
      </div>
    </section>

    ${bench ? `
    <section>
      <div class="eyebrow">Comparado con el promedio de mercado</div>
      <div class="chart-card">
        <table class="bench-table">
          <thead><tr><th></th><th>Esta propiedad</th><th>Promedio (mes ${mesActual})</th><th>vs. promedio</th></tr></thead>
          <tbody>
            ${benchRow('Exposición', expoTotal, bench.exposicion_promedio)}
            ${benchRow('Consultas', propConsultas.length, bench.consultas_promedio)}
            ${benchRow('Visitas', visitasCount, bench.visitas_presenciales_promedio)}
          </tbody>
        </table>
        ${diasPublicado > Number(cfg.dias_recordatorio_ajuste || 60) ? `
        <div class="reminder">⚠️ A esta altura, cuanto más pasa el tiempo sin acercarse al promedio, más difícil se vuelve concretar la venta al valor actual — suele ser señal de revisar el precio.</div>` : ''}
      </div>
    </section>` : ''}

    <section>
      <div class="eyebrow">Últimas consultas</div>
      <div class="chart-card">
        ${propConsultas.length === 0 ? '<div class="state-msg" style="padding:20px 0;">Todavía no hay consultas registradas.</div>' :
          propConsultas.slice(0, 8).map(c => visitRow(c)).join('')}
      </div>
    </section>
  `;

  app.innerHTML = html;

  function benchRow(label, actual, prom) {
    const ratio = prom > 0 ? (actual / prom) * 100 : 0;
    const cls = ratio >= 90 ? 'r-high' : ratio >= 60 ? 'r-mid' : 'r-low';
    return `<tr><td>${label}</td><td>${fmtInt(actual)}</td><td>${fmtInt(prom)}</td><td class="bench-ratio ${cls}">${ratio.toFixed(0)}%</td></tr>`;
  }

  function visitRow(c) {
    const etapa = (c.etapa || '').toLowerCase();
    let iconClass = 'ic-nuevo';
    if (['descarto', 'no califica', 'sin rta'].includes(etapa)) iconClass = 'ic-descarto';
    else if (['seguimiento', 'coordinar', 'negociando', 'frio'].includes(etapa)) iconClass = 'ic-seguimiento';
    else if (['compro', 'listo', 'reserva'].includes(etapa)) iconClass = 'ic-avance';
    return `
      <div class="visit">
        <div class="visit-icon ${iconClass}"></div>
        <div>
          <div class="visit-name">${c.nombre || 'Consulta'} <span style="font-weight:400;color:var(--muted);">· ${c.etapa || ''}</span></div>
          <div class="visit-meta">${fmtDate(c.fecha_creacion)} · ${c.fuente || ''}</div>
          ${c.feedback_visita ? `<div class="visit-feedback">${c.feedback_visita}</div>` : ''}
        </div>
      </div>`;
  }

  // ---- Chart ----
  const labels = propMetricas.map(r => fmtDate(r.fecha));
  const values = propMetricas.map(r => Number(r.clicks || 0));
  const bandsPlugin = {
    id: 'bands',
    beforeDatasetsDraw(chart) {
      const { ctx, chartArea: { left, right }, scales: { y } } = chart;
      const top = Math.max(y.max, bandaPrueba + 10);
      const zones = [
        { from: bandaPrueba, to: top, color: 'rgba(61,122,68,0.14)' },
        { from: bandaEspeculacion, to: bandaPrueba, color: 'rgba(169,118,15,0.14)' },
        { from: 0, to: bandaEspeculacion, color: 'rgba(192,72,61,0.10)' },
      ];
      zones.forEach(z => {
        const yTop = y.getPixelForValue(Math.min(z.to, y.max));
        const yBottom = y.getPixelForValue(z.from);
        ctx.fillStyle = z.color;
        ctx.fillRect(left, yTop, right - left, yBottom - yTop);
      });
    }
  };
  new Chart(document.getElementById('chartViews'), {
    type: 'line',
    data: { labels, datasets: [{ data: values, borderColor: '#2a78d6', borderWidth: 2, pointRadius: 0, tension: 0.25 }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { maxTicksLimit: 6, color: '#8891a1', font: { size: 10 } }, grid: { display: false } },
        y: { ticks: { color: '#8891a1', font: { size: 10 } }, grid: { color: '#e6e4dd' } }
      }
    },
    plugins: [bandsPlugin]
  });
}

render();
</script>
</body>
</html>
